<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localhost</title>
    <meta name="description" content="localhost knowledge base" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; object-src 'none'; style-src 'self' 'unsafe-inline';">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    
    <style>
        body { background-color: black; color: white; font-family: monospace; margin: 0; padding: 20px; }

        /* Navigation UI */
        .menu-container { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; text-align: center; }
        #menu-toggle { display: none; }
        .search-label { display: block; width: 266px; padding: 5px; background: #111; border: 1px solid #333; color: #666; cursor: pointer; font-size: 10px; text-transform: lowercase; }

        .dropdown-content { display: none; list-style: none; padding: 0; margin: 0; background: #111; border: 1px solid #333; width: 266px; }
        .dropdown-content li a { display: block; padding: 10px; color: peru; text-decoration: none; border-bottom: 1px solid #222; }
        #menu-toggle:checked ~ .dropdown-content { display: block; }

        /* Content Display (CSS Hash Logic) */
        #linkList { margin-top: 120px; padding: 0; list-style: none; }
        .titleInput { margin-bottom: 40px; display: none; }
        .article-text { display: block; color: #aaa; line-height: 1.6; max-width: 600px; }

        /* CSS :target selector handles page visibility without JS */
        .titleInput:target, body:not(:has(:target)) #main { 
            display: block !important; 
            animation: fadeIn 0.8s forwards; 
            border-left: 3px solid peru; 
            padding-left: 15px; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .ui-btn { background: #222; color: peru; border: 1px solid #444; cursor: pointer; padding: 8px; font-family: monospace; width: 266px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="menu-container">
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="search-label">click to browse keywords ▼</label>
        <ul class="dropdown-content" id="nav-list">
            <li><a href="#singleplayer">#singleplayer</a></li>
            <li><a href="#multiplayer">#multiplayer</a></li>	
            <li><a href="#searchengine">#searchengine</a></li>
         </ul>
    </div>

    <ul id="linkList">
        <li class="titleInput" id="singleplayer">
            <span class="article-text">
                <h2>single player</h2>
                <p>single player mode</p>
                <a href="./singleplayer/index.html#main"><button class="ui-btn" style="width: auto;">single player</button></a>
            </span>
        </li>
		
        <li class="titleInput" id="multiplayer">
            <span class="article-text">
                <h2>multiplayer</h2>
                <p>multiplayer mode</p>
                <a href="./multiplayer/index.html#main"><button class="ui-btn" style="width: auto;">multiplayer</button></a>
            </span>
        </li>

        <li class="titleInput" id="searchengine">
            <span class="article-text">
                <h2>search engine</h2>
                <p>search engine mode</p>
                <a href="./searchengine/index.html#main"><button class="ui-btn" style="width: auto;">search engine</button></a>
            </span>
        </li>
    </ul>

<script>
'use strict';

(function() {
    // 1. Disable Right-Click Context Menu
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. Disable Inspection Keyboard Shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            console.warn("Security: Inspection shortcuts are restricted.");
        }
    });

    // 3. The STOP! Security Warning
    const warningTitle = "STOP!";
    const warningText = "This is a developer feature. Copy-pasting code here is a scam and will compromise your data.";
    console.log(`%c${warningTitle}`, "color: red; font-size: 50px; font-weight: bold; -webkit-text-stroke: 1px black;");
    console.log(`%c${warningText}`, "color: peru; font-size: 16px; font-family: monospace;");
})();

// 4. URL Cleanup Logic
if (window.location.pathname.endsWith('.html') || window.location.pathname.endsWith('.htm')) {
    const cleanURL = window.location.href.replace(/index\.(html|htm)/, '');
    window.history.replaceState(null, '', cleanURL);
}

// 5. Initial State Load
window.addEventListener('load', () => {
    if (!window.location.hash || window.location.hash === '#main') {
        window.location.hash = 'main';
        console.log("External Conscious Initialized.");
    }
});
</script>
</body>
</html>
